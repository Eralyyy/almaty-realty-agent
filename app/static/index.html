<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almaty Realty Agent</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2129; --muted:#6b7280; --accent:#2563eb; --border:#e5e7eb; --tool:#f1f5f9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --text:#e6e8eb; --muted:#9aa1ab; --accent:#60a5fa; --border:#2a2f37; --tool:#1f242c; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:760px; margin:0 auto; padding:16px; display:flex; flex-direction:column; height:100vh; }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  h1 { font-size:18px; margin:0; flex:1; }
  select, input, button { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; }
  #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-bottom:12px; }
  .msg { padding:10px 14px; border-radius:12px; background:var(--card); border:1px solid var(--border); white-space:pre-wrap; overflow-wrap:anywhere; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; border:none; max-width:80%; }
  .event { font:12px/1.4 ui-monospace,monospace; color:var(--muted); background:var(--tool); border-radius:8px; padding:6px 10px; overflow-wrap:anywhere; }
  .usage { font-size:12px; color:var(--muted); }
  form { display:flex; gap:8px; }
  form input { flex:1; min-width:0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Квартиры в Алматы — AI-ассистент</h1>
    <select id="key" aria-label="Роль">
      <option value="guest-key">guest</option>
      <option value="agent-key" selected>agent</option>
      <option value="admin-key">admin</option>
    </select>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="input" placeholder="Например: двушка в Бостандыкском до 50 млн" autocomplete="off" required>
    <button>Отправить</button>
  </form>
</main>
<script>
const log = document.getElementById("log");
let sessionId = null;

function add(cls, text) {
  const el = document.createElement("div");
  el.className = cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

document.getElementById("key").addEventListener("change", () => { sessionId = null; log.innerHTML = ""; });

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("input");
  const message = input.value.trim();
  if (!message) return;
  input.value = "";
  add("msg user", message);
  let answer = null;

  const response = await fetch("/chat/stream", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-API-Key": document.getElementById("key").value },
    body: JSON.stringify({ message, session_id: sessionId }),
  });
  if (!response.ok) { add("msg", `Ошибка ${response.status}: ${await response.text()}`); return; }

  const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += value;
    const parts = buffer.split("\n\n");
    buffer = parts.pop();
    for (const part of parts) {
      const event = part.match(/^event: (.*)$/m)?.[1];
      const data = JSON.parse(part.match(/^data: (.*)$/m)?.[1] ?? "{}");
      if (event === "route") add("event", `маршрут: ${data.intent} (уверенность ${data.confidence})`);
      if (event === "tool_call") { answer = null; add("event", `→ ${data.name} ${JSON.stringify(data.arguments)}`); }
      if (event === "tool_result") add("event", `← ${data.name}: ${data.ok ? "ok" : "ошибка"} ${data.preview}`);
      if (event === "token") { answer ??= add("msg", ""); answer.textContent += data.text; }
      if (event === "error") add("msg", `Ошибка: ${data.message}`);
      if (event === "done") {
        sessionId = data.session_id;
        if (!answer) add("msg", data.answer);
        const u = data.usage;
        add("usage", `${(u.latency_ms / 1000).toFixed(1)} с · ${u.llm_calls} вызовов LLM · ${u.tool_calls} инструментов · ${u.input_tokens}+${u.output_tokens} токенов · $${u.cost_usd}`);
      }
    }
  }
});
</script>
</body>
</html>
